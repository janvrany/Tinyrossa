name: Check

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events...
  push:
    branches: [ master]
  pull_request:
    branches: [ master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests:
    name: "Tests - ${{matrix.dialect}}, ${{matrix.os}}"

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest ] #, windows-latest]
        dialect: [ pharo , stx ]

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Install required tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libz3-4 libz3-dev crossbuild-essential-riscv64 qemu-user gdb-multiarch crossbuild-essential-ppc64el mercurial
          # Following is needed because by default, libgdbs uses /usr/bin/gdb
          # which is not multiarch GDB! Nasty workaround, indeed.
          sudo cp /usr/bin/gdb-multiarch /usr/bin/gdb

      - name: Fetch commits so that Iceberg doesn't crash
        run: git fetch --unshallow

      - name: Build
        run: |
          make -C ${{matrix.dialect}}

      - name: Test
        run: |
          make -C ${{matrix.dialect}} test
